# map.yakimafinds.com - Junk Run Map
# Copy to /etc/nginx/sites-available/map.yakimafinds.com
# Then: sudo ln -s /etc/nginx/sites-available/map.yakimafinds.com /etc/nginx/sites-enabled/
# Then: sudo certbot --nginx -d map.yakimafinds.com
# Then: sudo nginx -t && sudo systemctl reload nginx

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name map.yakimafinds.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name map.yakimafinds.com;

    # SSL - certbot will fill these in
    # ssl_certificate /etc/letsencrypt/live/map.yakimafinds.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/map.yakimafinds.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy to SvelteKit (same as yfevents)
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
